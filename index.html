  :root{
    --band1:#fff6da; --band2:#e6f4fb; --accent:#f0a93a; --ink:#d98a2b; --tag:#4aa3d8;
    --display:'Fredoka', system-ui, sans-serif; --monthsize:54px;
    --pageink:#1c2530; --hair:#e4e7ec; --weekend:#fafbfc;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:#f1f3f6; color:var(--pageink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1340px; margin:0 auto; padding:24px 20px 60px}

  /* ---------- Controls ---------- */
  .controls{background:#fff; border:1px solid var(--hair); border-radius:14px;
    padding:18px 20px; margin-bottom:22px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .controls h1{font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:#475569; margin-bottom:14px; display:flex; align-items:center; gap:10px}
  .controls h1 .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); transition:.2s}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#7a8696}
  input[type=text], select{font:inherit; font-size:14px; padding:9px 11px; border:1px solid #d3d8e0;
    border-radius:9px; background:#fff; color:var(--pageink); min-width:130px}
  input[type=text]:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(240,169,58,.18)}
  .btn{font:inherit; font-size:13px; font-weight:600; padding:10px 16px; border-radius:9px;
    border:1px solid #d3d8e0; background:#fff; color:#2a3340; cursor:pointer; transition:.12s;
    display:inline-flex; align-items:center; gap:7px}
  .btn:hover{border-color:#9aa6b4; background:#f8fafc}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent; border-color:transparent; color:#6b7685}
  .btn.ghost:hover{background:#f1f3f6; color:#2a3340}
  .btn svg{width:15px; height:15px}
  .divider{height:1px; background:var(--hair); margin:16px 0}
  .hint{font-size:12px; color:#8a95a3; line-height:1.5}
  .hint code{background:#f1f3f6; padding:1px 6px; border-radius:5px; font-size:11px}
  .chk{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:#475569; cursor:pointer; user-select:none}
  .chk input{width:15px; height:15px; accent-color:var(--accent)}

  /* big primary drop zone */
  .dropbig{display:flex; align-items:center; gap:16px; width:100%;
    border:2px dashed #c8d0da; border-radius:14px; padding:22px 24px; cursor:pointer;
    background:#fbfcfd; transition:.14s}
  .dropbig:hover, .dropbig.over{border-color:var(--accent); background:#fffaf2}
  .dropbig .upico{flex:none; width:46px; height:46px; border-radius:12px; background:#eef3f8;
    display:flex; align-items:center; justify-content:center; color:var(--accent)}
  .dropbig.over .upico{background:#fff}
  .dropbig .upico svg{width:24px; height:24px}
  .dropbig .uptext{flex:1}
  .dropbig .uptext b{display:block; font-size:15px; color:#2a3340; margin-bottom:2px}
  .dropbig .uptext span{font-size:12.5px; color:#8a95a3}
  .dropbig .upacts{display:flex; gap:8px; flex:none}

  /* ---------- Sheet ---------- */
  #stage{display:flex; justify-content:center}
  #sheet{width:100%; max-width:1300px; background:#fff; border-radius:6px;
    box-shadow:0 8px 30px rgba(16,24,40,.10); overflow:hidden}

  .band{position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:26px 40px; min-height:202px; background:linear-gradient(120deg,var(--band1),var(--band2)); overflow:hidden}
  .band .meta{position:relative; z-index:2}
  .band .office{font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:8px}
  .band .month{font-family:var(--display); font-size:var(--monthsize); line-height:1; color:var(--ink)}
  .band .month .yr{font-family:'Fredoka',sans-serif; font-weight:600; color:#8893a2;
    margin-left:16px; font-size:40px; vertical-align:9px}
  .band .tagline{margin-top:8px; font-family:var(--display); font-size:25px; color:var(--tag); line-height:1.1}
  .band .art{position:relative; z-index:2; width:300px; height:160px; flex:none}
  .band .art svg{width:100%; height:100%; overflow:visible}
  .keyline{height:5px; background:var(--accent)}

  table.cal{width:100%; border-collapse:collapse; table-layout:fixed}
  table.cal th{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink); padding:11px 8px; background:color-mix(in srgb,var(--accent) 9%,#fff);
    border-bottom:1px solid var(--hair)}

  .footer{display:flex; align-items:center; justify-content:space-between; gap:18px;

  .notes{font-size:12px; color:#7a8696; flex:1; min-width:200px; text-align:right}

  .notes [contenteditable]{outline:none; min-width:80px; display:inline-block; border-bottom:1px dashed #d3d8e0}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1c2530; color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:500;
    opacity:0; transition:.25s; pointer-events:none; z-index:99}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media print{
    @page{size:11in 8.5in; margin:.35in}
    html,body{background:#fff}
    .wrap{max-width:none; padding:0}
    .controls{display:none !important}
    #sheet{box-shadow:none; max-width:none; width:100%; border-radius:0}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    table.cal td{height:94px}
  }
</style>

     <g transform="translate(70,118)"><rect x="-22" y="-4" width="44" height="34" rx="3" fill="#c0392b"/><rect x="-3" y="-4" width="6" height="34" fill="#f2c94c"/><rect x="-22" y="-9" width="44" height="8" rx="2" fill="#a02a20"/><path d="M0 -9 q-10 -16 -16 -2 q10 2 16 2 q6 0 16 -2 q-6 -14 -16 2Z" fill="#f2c94c"/></g></svg>`
  };
  return A[m]||A[5];
}

function cloverLeaf(dx,dy){return `<path transform="translate(${dx},${dy})" d="M0 8 C-9 -3 -18 3 -10 13 C-6 18 0 20 0 20 C0 20 6 18 10 13 C18 3 9 -3 0 8Z" fill="#2f9e57"/>`;}
function flower(x,y,c){return `<g transform="translate(${x},${y})">${[0,72,144,216,288].map(a=>`<ellipse cx="${Math.cos(a*Math.PI/180)*14}" cy="${Math.sin(a*Math.PI/180)*14}" rx="9" ry="13" fill="${c}" transform="rotate(${a})"/>`).join('')}<circle r="8" fill="#ffd24b"/><path d="M0 14 Q4 40 -6 52" stroke="#2f9e57" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;}
function petals(c,n,r){let s='';for(let i=0;i<n;i++){const a=i*360/n;s+=`<ellipse cx="0" cy="${-r-10}" rx="6" ry="14" fill="${c}" transform="rotate(${a})"/>`;}return s;}
function rain(x,y){return `<path d="M${x} ${y} q-4 8 0 12 q4 -4 0 -12Z" fill="#5aa0d8"/>`;}
function rays(c,r){r=r||58;let s='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<line x1="${Math.cos(a)*(r-4)}" y1="${Math.sin(a)*(r-4)}" x2="${Math.cos(a)*(r+14)}" y2="${Math.sin(a)*(r+14)}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;}return s;}
function burst(x,y,c){let s=`<g transform="translate(${x},${y})">`;for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<line x1="${Math.cos(a)*8}" y1="${Math.sin(a)*8}" x2="${Math.cos(a)*30}" y2="${Math.sin(a)*30}" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${Math.cos(a)*34}" cy="${Math.sin(a)*34}" r="3" fill="${c}"/>`;}return s+'</g>';}
function star5(x,y,c){return `<path transform="translate(${x},${y}) scale(.9)" d="M0 -12 3.5 -3.7 12 -3.7 5 2.8 7.4 12 0 6.2 -7.4 12 -5 2.8 -12 -3.7 -3.5 -3.7Z" fill="${c}"/>`;}
function star5b(x,y,c){return `<path transform="translate(${x},${y}) scale(1.4)" d="M0 -12 3.5 -3.7 12 -3.7 5 2.8 7.4 12 0 6.2 -7.4 12 -5 2.8 -12 -3.7 -3.5 -3.7Z" fill="${c}"/>`;}
function bat(x,y){return `<g transform="translate(${x},${y})" fill="#4a2a6a"><circle r="7"/><path d="M-7 -2 q-12 -10 -20 -2 q10 2 12 8 q3 -8 8 -6Z"/><path d="M7 -2 q12 -10 20 -2 q-10 2 -12 8 q-3 -8 -8 -6Z"/></g>`;}
function leaf(x,y,c,rot){return `<path transform="translate(${x},${y}) rotate(${rot})" d="M0 0 C18 -6 22 -22 8 -30 C-6 -22 -18 -6 0 0Z M0 0 L6 -22" fill="${c}" stroke="#8a3f1a" stroke-width="1.5"/>`;}
function tailFan(){const cs=['#c0392b','#d98a2b','#e8b04b','#b5642a','#8a4a22'];let s='';for(let i=0;i<5;i++){const a=(i-2)*26;s+=`<ellipse cx="0" cy="-30" rx="10" ry="30" fill="${cs[i]}" transform="rotate(${a}) translate(0,-6)"/>`;}return `<g transform="translate(0,2)">${s}</g>`;}

/* ---------- State ---------- */
let events=[]; let autoMonthSet=false;
function curMonth(){return parseInt(document.getElementById('month').value,10);}
function curYear(){return parseInt(document.getElementById('year').value,10);}

/* ---------- Parsing ---------- */
function parseDayValue(v){
  if(v==null)return null;
  if(v instanceof Date)return{day:v.getDate(),m:v.getMonth(),y:v.getFullYear()};
  if(typeof v==='number'){ if(v>=1&&v<=31&&Number.isInteger(v))return{day:v};
    const d=new Date(Math.round((v-25569)*86400*1000)); if(!isNaN(d))return{day:d.getUTCDate(),m:d.getUTCMonth(),y:d.getUTCFullYear()}; return null; }
  const s=String(v).trim(); if(!s)return null;
  const d=new Date(s); if(!isNaN(d)&&/\d{1,2}[\/\-]\d{1,2}|[A-Za-z]{3}/.test(s))return{day:d.getDate(),m:d.getMonth(),y:d.getFullYear()};
  const n=parseInt(s.match(/\d{1,2}/)?.[0]??'',10); if(n>=1&&n<=31)return{day:n}; return null;
}
function ingestRows(rows){
  if(!rows.length)return; let header=null,start=0;
  const first=rows[0].map(c=>String(c||'').trim().toLowerCase());
  if(first.some(c=>['date','day','title','event','category','time','person'].includes(c))){header=first;start=1;}
  const col=names=>header?header.findIndex(h=>names.includes(h)):-1;
  const idx=header?{date:col(['date','day']),time:col(['time']),title:col(['title','event','description','name']),cat:col(['category','cat','type']),person:col(['person','agent','who']),note:col(['note','notes','location'])}:{date:0,time:1,title:2,cat:3,person:4,note:5};
  const out=[];
  for(let i=start;i<rows.length;i++){const r=rows[i]; if(!r)continue;
    const g=j=>j>=0&&j<r.length?String(r[j]??'').trim():'';
    const rawDate=idx.date>=0?r[idx.date]:r[0]; const title=g(idx.title);
    if(!title&&!g(idx.cat))continue;
    const dv=parseDayValue(rawDate); if(!dv||!dv.day)continue;
    const cat=resolveCat(g(idx.cat),title);
    out.push({day:dv.day,month:(dv.m??null),year:(dv.y??null),time:g(idx.time),title:title||CAT[cat].label,cat,person:g(idx.person),note:g(idx.note)});
    if(!autoMonthSet&&dv.m!=null){setMonthYear(dv.m,dv.y);autoMonthSet=true;}
  }
  if(out.length){events=out;render();toast(out.length+' event'+(out.length>1?'s':'')+' loaded');}
  else toast('No rows could be read — check the columns');
}

/* ---------- Render ---------- */
function applyTheme(){
  const t=THEME[curMonth()]; const r=document.documentElement.style;
  r.setProperty('--band1',t.b1); r.setProperty('--band2',t.b2);
  r.setProperty('--accent',t.accent); r.setProperty('--ink',t.ink);
  r.setProperty('--tag',t.tag); r.setProperty('--display',t.font); r.setProperty('--monthsize',t.size);
  document.getElementById('o-tag').textContent=t.line;
  document.querySelector('.controls h1 .dot').style.background=t.accent;
  const artEl=document.getElementById('o-art'); artEl.innerHTML=art(curMonth());
  artEl.style.setProperty('--b1',t.b1);
}
function render(){
  applyTheme();
  const m=curMonth(),y=curYear();
  document.getElementById('o-office').textContent=document.getElementById('office').value;
  document.getElementById('o-month').textContent=MONTHS[m];
  document.getElementById('o-year').textContent=y;
  document.getElementById('o-head').innerHTML=DOW.map(d=>'<th>'+d+'</th>').join('');
  const byDay={};
  events.forEach(e=>{ if(e.month!=null&&(e.month!==m||(e.year!=null&&e.year!==y)))return; (byDay[e.day]=byDay[e.day]||[]).push(e); });
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push({n:prevDays-first+1+i,out:true});
  for(let d=1;d<=days;d++)cells.push({n:d,out:false});
  while(cells.length%7!==0)cells.push({n:cells.length-(first+days)+1,out:true});
  let body='',html='';
  cells.forEach((c,i)=>{
    if(i%7===0)html='<tr>';
    const weekend=(i%7===0||i%7===6); const evs=!c.out?(byDay[c.n]||[]):[]; const isHol=evs.some(e=>e.cat==='holiday');
    let cls=''; if(c.out)cls=' out'; else{ if(weekend)cls+=' weekend'; if(isHol)cls+=' holiday-cell'; }
    const evHtml=evs.map(e=>{const c2=CAT[e.cat]; const sub=[e.time,e.person].filter(Boolean).join(' · '); const rb=e.cat==='holiday'?' ribbon':'';
      return '<div class="ev'+rb+'" style="--c:'+c2.color+'"><span class="ic">'+svg(c2.icon)+'</span><span class="tx"><b>'+esc(e.title)+'</b>'+(sub?'<i>'+esc(sub)+'</i>':'')+'</span></div>';}).join('');
    html+='<td class="'+cls.trim()+'"><span class="dnum">'+c.n+'</span>'+(evHtml?'<div class="events">'+evHtml+'</div>':'')+'</td>';
    if(i%7===6){html+='</tr>';body+=html;}
  });
  document.getElementById('o-body').innerHTML=body;
  const present=[...new Set(events.filter(e=>e.month==null||e.month===m).map(e=>e.cat))];
  const order=['meeting','training','visit','birthday','social','holiday','deadline','event'];
  const leg=order.filter(id=>present.includes(id));
  document.getElementById('o-legend').innerHTML=leg.map(id=>{const c=CAT[id];return '<span class="li"><span class="sw" style="background:'+c.color+'">'+svg(c.icon)+'</span>'+c.label+'</span>';}).join('');
  document.getElementById('o-legend').style.display=document.getElementById('showLegend').checked&&leg.length?'flex':'none';
  document.getElementById('o-notes').style.display=document.getElementById('showNotes').checked?'block':'none';
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- Selectors ---------- */
function setMonthYear(m,y){ if(m!=null)document.getElementById('month').value=m;
  if(y!=null){const ys=document.getElementById('year'); if(![...ys.options].some(o=>+o.value===y)){const o=document.createElement('option');o.value=y;o.textContent=y;ys.appendChild(o);} ys.value=y;} }
(function init(){const ms=document.getElementById('month');MONTHS.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;ms.appendChild(o);});
  const ys=document.getElementById('year'),now=new Date().getFullYear();for(let y=now-1;y<=now+3;y++){const o=document.createElement('option');o.value=y;o.textContent=y;ys.appendChild(o);}
  ms.value=5;ys.value=2026;})();

/* ---------- Exports ---------- */
async function exportPNG(){
  if(typeof html2canvas==='undefined'){toast('Image library unavailable offline');return;}
  const sheet=document.getElementById('sheet'); const pw=sheet.style.width,pm=sheet.style.maxWidth;
  sheet.style.width='1300px';sheet.style.maxWidth='1300px';
  try{ if(document.fonts&&document.fonts.ready)await document.fonts.ready; }catch(e){}
  await new Promise(r=>setTimeout(r,60));
  try{
    const canvas=await html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const a=document.createElement('a');
    const name=(document.getElementById('office').value?document.getElementById('office').value.replace(/\s+/g,'-')+'-':'')+MONTHS[curMonth()]+'-'+curYear()+'-calendar.png';
    a.download=name;a.href=canvas.toDataURL('image/png');a.click();toast('PNG exported');
  }catch(e){toast('Export failed');console.error(e);}
  sheet.style.width=pw;sheet.style.maxWidth=pm;
}
function downloadTemplate(){
  if(typeof XLSX==='undefined'){toast('Excel library unavailable offline');return;}
  const data=[['Date','Time','Title','Category','Person','Note'],
    [2,'9:30 AM','All Company Sales Meeting','Meeting','','in Tulsa'],
    [10,'','Launchpad Starts','Class','',''],
    [11,'','Dillon — systems check','IT','',''],
    [12,'','Cassie — front desk','Admin','',''],
    [18,'','Shelly Rivera visiting','Agent','',''],
    [25,'3:00–5:30 PM','Happy Hour','Social','','']];
  const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:10},{wch:14},{wch:30},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Events');XLSX.writeFile(wb,'calendar-template.xlsx');toast('Template downloaded');
}
function readFile(f){const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});autoMonthSet=false;ingestRows(rows);}catch(err){toast('Could not read file');console.error(err);}};r.readAsArrayBuffer(f);}

   [30,'10:00 AM','No Meeting — Listing Lab','Class','','']];
  ingestRows([['Date','Time','Title','Category','Person','Note'],...s]);

/* ---------- Toast ---------- */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- Wiring ---------- */
document.getElementById('sample').onclick=e=>{e.preventDefault();loadSample();};
document.getElementById('template').onclick=e=>{e.preventDefault();downloadTemplate();};
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('pngBtn').onclick=exportPNG;
['month','year','office','showLegend','showNotes'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',render);el.addEventListener('input',render);});
const fileInput=document.getElementById('file'),drop=document.getElementById('drop');
fileInput.onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);};
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);});

loadSample();
